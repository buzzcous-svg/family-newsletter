<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A private family newsletter app for sharing updates, photos, and upcoming events, and reading weekly and monthly issues together.">
<title>Family Newsletter</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23141412'/%3E%3Ctext x='50' y='70' font-family='Arial, Helvetica, sans-serif' font-size='60' font-weight='800' fill='%23FFFFFF' text-anchor='middle'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --card:#FFFFFF;
    --ink:#141412;
    --ink-soft:#6B6B63;
    --moss:#141412;
    --moss-dark:#000000;
    --marigold:#C1552E;
    --berry:#B23A3A;
    --line:#E5E3DB;
    --line-strong:#141412;
    --shadow: 0 1px 2px rgba(20,20,18,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:1180px;margin:0 auto;min-height:100vh;position:relative;}

  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Inter',sans-serif; font-weight:800;}
  /* visually-hidden but still announced by screen readers — for labels with no visible text */
  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  /* hidden like .sr-only until keyboard-focused, then pinned to the top so keyboard users can
     jump past the repeated nav straight to the main content (WCAG 2.4.1) */
  .skip-link{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
    z-index:1000;
  }
  .skip-link:focus{
    position:fixed; top:10px; left:10px; width:auto; height:auto; margin:0;
    overflow:visible; clip:auto; white-space:normal;
    background:var(--ink,#1a1a1a); color:#fff; padding:10px 18px; border-radius:6px;
    font-weight:700; text-decoration:none;
  }

  /* ---- Letterboxed images: full image always visible (object-fit:contain), with a blurred
     copy of the same image filling the background behind it so any empty margin blends with
     the photo's own colors instead of showing a flat placeholder tone. ---- */
  .img-blend{position:relative; overflow:hidden; background:#F1EFE8; display:block;}
  .img-blend .ib-bg{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:blur(26px) saturate(1.4) brightness(.88); transform:scale(1.25); opacity:.85;
  }
  .img-blend .ib-fg{position:relative; width:100%; height:100%; object-fit:contain; display:block; z-index:1;}

  /* ---- Masthead ---- */
  .masthead{
    background:var(--paper);
  }
  .masthead-row{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:18px 20px; border-bottom:1px solid var(--line-strong);
    position:sticky; top:0; z-index:20; background:var(--paper);
  }
  .brand{
    font-family:'Inter',sans-serif; font-weight:800; font-size:15px; letter-spacing:.03em;
    text-transform:uppercase; color:var(--ink); white-space:nowrap;
  }
  .masthead-right{display:flex; align-items:center; gap:24px; flex-wrap:wrap;}
  .nav-create-btn{padding:9px 16px; font-size:12.5px; white-space:nowrap; flex-shrink:0;}

  nav.tabs{ display:flex; gap:22px; flex-wrap:wrap; }
  nav.tabs button{
    font-family:'Inter',sans-serif; font-size:12.5px; letter-spacing:.02em;
    background:none; border:none; padding:2px 0; cursor:pointer; color:var(--ink-soft);
    border-bottom:1.5px solid transparent; transition:all .15s;
  }
  nav.tabs button.active{color:var(--ink); border-color:var(--ink); font-weight:600;}
  nav.tabs button:hover:not(.active){color:var(--ink);}

  .hero-banner{
    padding:20px 20px 22px; border-bottom:2px solid var(--line-strong);
  }
  .today-line{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);
    font-weight:600; margin-bottom:8px;
  }
  .hero-banner h1{
    font-family:'Inter',sans-serif; font-weight:800;
    font-size:clamp(28px,4.2vw,44px); line-height:1.08; letter-spacing:-0.01em;
    margin:0; color:var(--ink);
  }

  main{padding:28px 20px 90px;}

  /* ---- Filter chips ---- */
  .chips-row{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:24px;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; flex:1;}
  .chips-row-actions{display:flex; gap:10px; align-items:center; flex-shrink:0;}
  .chips-row-actions .btn.small{white-space:nowrap;}
  .chip{
    font-family:'Inter',sans-serif; font-size:11.5px; text-transform:uppercase; font-weight:600;
    letter-spacing:.03em; padding:7px 14px; border-radius:20px; border:1.5px solid var(--ink);
    background:var(--card); cursor:pointer; color:var(--ink);
  }
  .chip.active{background:var(--ink); color:var(--paper);}
  .sort-select{
    font-family:'Inter',sans-serif; font-size:12px; padding:8px 10px; border:1px solid var(--ink-soft);
    border-radius:4px; background:#fff; color:var(--ink); flex-shrink:0; cursor:pointer;
    width:auto; max-width:170px;
  }

  /* ---- "happening today" highlight ---- */
  .today-highlight{background:#FFF3E4;}
  .post-row.today-highlight{margin:0 -14px 22px; padding:28px 18px 24px; border-bottom:none; border-radius:6px;}
  .today-badge{
    display:inline-block; align-self:flex-start; font-family:'Inter',sans-serif; font-size:10px; font-weight:800; text-transform:uppercase;
    letter-spacing:.05em; color:#fff; background:var(--marigold); padding:3px 9px; border-radius:20px; margin-bottom:6px;
  }
  .today-badge.inline{margin:0 0 0 6px; padding:2px 7px; font-size:9px;}
  .side-event.today-highlight{background:#FFF3E4;}

  /* ---- mobile-only upcoming events + latest issue (hidden on desktop; the sidebar shows these instead) ---- */
  .mobile-upcoming{display:none;}
  .mobile-latest-issue{display:none;}

  /* ---- Post card (legacy, unused by new home layout but kept for safety) ---- */
  .feed{position:relative; padding-left:22px;}
  .feed::before{
    content:""; position:absolute; left:5px; top:6px; bottom:6px; width:1px;
    background-image:linear-gradient(var(--line) 60%, transparent 0%);
    background-size: 2px 8px; background-repeat:repeat-y;
  }
  .card{
    position:relative; background:var(--card); border:1px solid var(--line);
    border-radius:4px; margin-bottom:22px; box-shadow:var(--shadow); overflow:visible;
  }
  .card::before{
    content:""; position:absolute; left:-22px; top:22px; width:9px; height:9px;
    border-radius:50%; background:var(--moss); border:2px solid var(--paper);
  }
  .card-inner{padding:18px 18px 16px;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .type-badge{
    font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:.08em; padding:3px 9px; border-radius:3px; color:#fff; white-space:nowrap;
  }
  .stamp{
    font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase;
    letter-spacing:.05em; border:1.5px solid var(--berry); color:var(--berry);
    border-radius:50%; width:58px; height:58px; display:flex; align-items:center;
    justify-content:center; text-align:center; line-height:1.15; transform:rotate(-9deg);
    flex-shrink:0; padding:4px; opacity:.85;
  }
  .card h3{font-family:'Inter',sans-serif; font-weight:800; font-size:21px; margin:10px 0 4px;}
  .card .meta{font-size:12px; color:var(--ink-soft); margin-bottom:8px;}
  .card .meta span::after{content:"·"; margin:0 6px; color:var(--line);}
  .card .meta span:last-child::after{content:"";}
  .card p.desc{font-size:14px; color:var(--ink); line-height:1.55; margin:0 0 10px;}
  .card img.thumb, .card video.thumb{width:100%; max-height:260px; object-fit:cover; border-radius:3px; border:1px solid var(--line); display:block; cursor:pointer;}
  .card .thumb-wrap{position:relative; cursor:pointer;}
  .card .thumb-wrap .play-badge{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:44px; height:44px; border-radius:50%; background:rgba(35,49,44,.65);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; pointer-events:none;
  }
  .card-actions{display:flex; gap:6px;}
  .icon-btn{
    background:none; border:1px solid var(--ink-soft); border-radius:4px; width:28px; height:28px;
    cursor:pointer; font-size:13px; color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{border-color:var(--ink); color:var(--ink);}
  .icon-btn.danger:hover{border-color:var(--berry); color:var(--berry);}
  .icon-btn:disabled{opacity:.3; cursor:not-allowed;}
  .icon-btn:disabled:hover{border-color:var(--line); color:var(--ink-soft);}
  .icon-btn.mini{width:24px; height:24px; font-size:9px;}
  .edit-item-controls{display:flex; flex-direction:column; gap:6px; align-items:center; flex-shrink:0;}
  .edit-item-order{display:flex; flex-direction:column; gap:2px;}
  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty .display{font-size:22px; color:var(--ink); margin-bottom:6px;}

  /* ---- Pill badge + meta row (shared) ---- */
  .pill{
    display:inline-block; font-family:'Inter',sans-serif; font-size:10.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.04em; border:1.5px solid var(--ink); color:var(--ink);
    border-radius:20px; padding:5px 13px; white-space:nowrap; background:var(--paper);
  }
  .meta-row{display:flex; gap:22px; flex-wrap:wrap;}
  .meta-item{display:flex; flex-direction:column; gap:2px;}
  .meta-label{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:600;}
  .meta-val{font-size:12.5px; color:var(--ink); font-weight:500;}
  .meta-val.link{text-decoration:underline; text-underline-offset:2px;}
  .play-badge{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:44px; height:44px; border-radius:50%; background:rgba(20,20,18,.6);
    color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; pointer-events:none;
  }
  .play-badge.small{width:26px; height:26px; font-size:10px;}
  .media-count{
    position:absolute; bottom:6px; right:6px; background:rgba(20,20,18,.75); color:#fff;
    font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; pointer-events:none;
  }

  /* ---- Home two-column grid ---- */
  .home-grid{display:grid; grid-template-columns:1fr 320px; gap:44px; align-items:start;}

  /* ---- Post row (magazine list item) ---- */
  .post-row{display:flex; gap:18px; padding:22px 0;}
  .post-list .post-row:first-child{padding-top:0;}
  .post-row:not(:last-child){border-bottom:1px solid var(--line);}
  .post-row.flash{animation:flash-hl 1.6s ease;}
  @keyframes flash-hl{0%{background:#F4EDE3;} 100%{background:transparent;}}
  .pr-thumb{
    position:relative; width:120px; height:120px; flex-shrink:0; border:1px solid var(--line);
    overflow:hidden; cursor:pointer; background:#eee;
  }
  .pr-thumb img, .pr-thumb video{width:100%; height:100%; object-fit:cover; display:block;}
  .pr-thumb .pr-thumb-img{width:100%; height:100%;}
  .pr-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:6px;}
  .pr-text{cursor:pointer;}
  .pr-body h2{font-family:'Inter',sans-serif; font-weight:800; font-size:18.5px; margin:0; letter-spacing:-.01em;}
  .pr-body p{font-size:13.5px; color:var(--ink-soft); line-height:1.55; margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .pr-meta-row{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:6px; flex-wrap:wrap;}
  .pr-actions{display:flex; align-items:center; gap:8px;}

  /* ---- Sidebar ---- */
  .sidebar{display:flex; flex-direction:column; gap:22px;}
  .side-card{border:1px solid var(--line-strong); background:var(--card);}
  .side-heading{
    font-family:'Inter',sans-serif; font-weight:800; font-size:12px; text-transform:uppercase;
    letter-spacing:.05em; padding:14px 16px; border-bottom:1px solid var(--line-strong);
  }
  .upcoming-events-heading{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .side-toggle{
    background:none; border:1px solid var(--line-strong); border-radius:4px; width:24px; height:24px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); font-size:11px; flex-shrink:0;
  }
  .side-toggle:hover{background:var(--line);}
  .side-empty{padding:14px 16px; font-size:12.5px; color:var(--ink-soft);}

  .issue-promo{cursor:pointer;}
  .issue-promo .issue-promo-img{width:100%; height:170px; border-bottom:1px solid var(--line-strong);}
  .issue-promo-body{padding:14px 16px 4px;}
  .ip-label{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; margin-bottom:4px;}
  .ip-title{font-family:'Inter',sans-serif; font-weight:800; font-size:15.5px; line-height:1.3;}
  .ip-cta{
    display:block; text-align:center; background:var(--ink); color:var(--paper);
    font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:12px; margin:14px 0 0;
  }

  .side-group-label{padding:12px 16px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); font-weight:700;}
  .side-event{display:flex; gap:12px; align-items:baseline; padding:9px 16px; cursor:pointer; border-top:1px solid var(--line);}
  .side-group-label + .side-event{border-top:none;}
  .side-event .se-date{font-size:11px; font-weight:700; color:var(--ink-soft); width:44px; flex-shrink:0;}
  .side-event .se-title{font-size:13px; color:var(--ink); line-height:1.35;}
  .side-event:hover .se-title{text-decoration:underline;}

  .share-card{padding:16px;}
  .share-card .side-heading{padding:0 0 10px; border-bottom:none;}
  .share-card p{font-size:13px; color:var(--ink-soft); line-height:1.5; margin:0 0 14px;}
  .btn.block{width:100%; text-align:center;}

  /* ---- Buttons ---- */
  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px; padding:10px 18px;
    border-radius:4px; border:1px solid var(--ink); background:var(--ink); color:var(--paper);
    cursor:pointer; transition:opacity .15s;
  }
  .btn:hover{opacity:.85;}
  .btn.secondary{background:transparent; color:var(--ink); border:1px solid var(--ink-soft);}
  /* deeper than --marigold specifically so white text clears WCAG AA contrast (≈5.8:1) —
     --marigold itself is too light to pair with any single text color at 4.5:1 with real margin */
  .btn.ai{background:#A8481F; border-color:#A8481F; color:#fff;}
  .btn:disabled{opacity:.5; cursor:default;}
  .btn.small{padding:6px 12px; font-size:12px;}

  /* ---- Form ---- */
  .form-card{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:22px; box-shadow:var(--shadow);}
  label{display:block; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin:24px 0 8px;}
  /* border uses --ink-soft, not --line — --line (E5E3DB on white) measures ~1.3:1, well under
     the 3:1 minimum for a form field's only boundary cue (WCAG 1.4.11 Non-text Contrast);
     --ink-soft already clears 5:1 and matches the label color above each field */
  input[type=text], textarea, select, input[type=date]{
    width:100%; padding:10px 12px; border:1px solid var(--ink-soft); border-radius:4px;
    font-family:'Inter',sans-serif; font-size:14px; background:#fff; color:var(--ink);
  }
  textarea{min-height:90px; resize:vertical;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:24px;}
  .row2 label{margin-top:0;}
  .checkbox-row{display:flex; align-items:center; gap:8px; margin:24px 0 0; text-transform:none; cursor:pointer;}
  .checkbox-row input[type=checkbox]{width:18px; height:18px; flex-shrink:0; accent-color:var(--ink); cursor:pointer;}
  .checkbox-row span{font-size:14px; font-weight:500; letter-spacing:normal; color:var(--ink);}
  .ai-desc-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-wrap:wrap; margin:2px 0 8px;
  }
  .ai-desc-row-label{font-size:12.5px; color:var(--ink-soft);}
  .ai-desc-row .btn{flex-shrink:0;}
  .upload-zone{
    border:1.5px dashed var(--line); border-radius:6px; padding:20px; text-align:center;
    color:var(--ink-soft); font-size:13px; cursor:pointer; margin-top:2px;
  }
  .upload-zone:hover{border-color:var(--moss); color:var(--moss);}
  .thumbs-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .thumbs-row .t{position:relative; width:70px; height:70px; border-radius:4px; overflow:hidden; border:1px solid var(--line);}
  .thumbs-row img, .thumbs-row video{width:100%; height:100%; object-fit:cover;}
  .thumbs-row .x{position:absolute; top:2px; right:2px; background:rgba(0,0,0,.6); color:#fff; border:none; border-radius:50%; width:24px; height:24px; font-size:13px; cursor:pointer; line-height:1;}
  .thumbs-row .vbadge{position:absolute; bottom:2px; left:2px; background:rgba(0,0,0,.6); color:#fff; font-size:9px; padding:1px 4px; border-radius:3px;}
  .thumbs-row .star{
    position:absolute; bottom:2px; right:2px; background:rgba(0,0,0,.5); color:rgba(255,255,255,.6);
    border:none; border-radius:50%; width:24px; height:24px; font-size:13px; cursor:pointer; line-height:1;
  }
  .thumbs-row .star.featured{background:var(--marigold); color:#fff;}
  .form-actions{display:flex; gap:10px; margin-top:22px; justify-content:flex-end;}

  /* ---- Newsletters ---- */
  .gen-bar{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    border:1px solid var(--line-strong); padding:14px 16px; margin-bottom:22px;
  }
  .gen-bar .txt{font-size:13px; color:var(--ink-soft);}
  .issue-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .issue-card{
    position:relative; border:1px solid var(--line-strong); overflow:hidden;
    cursor:pointer; transition:opacity .15s;
  }
  .issue-card:hover{opacity:.7;}
  .issue-card .issue-card-img{width:100%; height:150px; border-bottom:1px solid var(--line-strong);}
  .issue-card .ic-body{padding:14px 16px;}
  .issue-card .no{font-family:'Inter',sans-serif; font-weight:700; font-size:10px; letter-spacing:.05em; color:var(--ink-soft); text-transform:uppercase;}
  .issue-card h2{font-family:'Inter',sans-serif; font-weight:800; font-size:17px; margin:6px 0 8px; letter-spacing:-.01em;}
  .issue-card .n{font-size:11px; color:var(--ink-soft);}
  .issue-card .issue-delete{
    position:absolute; top:8px; right:8px; z-index:2; background:rgba(255,255,255,.92);
    border-color:var(--line-strong);
  }

  /* ---- Newsletter detail ---- */
  .issue-header{margin-bottom:26px; border-bottom:1px solid var(--line-strong); padding-bottom:18px;}
  .issue-header .no{font-family:'Inter',sans-serif; font-weight:700; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}
  .issue-header h2{
    font-family:'Inter',sans-serif; font-weight:800;
    font-size:clamp(24px,3.6vw,36px); line-height:1.08; margin:8px 0 0; letter-spacing:-.01em;
  }
  .hero{border:1px solid var(--line-strong); margin-bottom:20px;}
  .hero .hero-img{width:100%; aspect-ratio:2/1; border-bottom:1px solid var(--line-strong);}
  .hero-body{padding:22px; background:var(--card);}
  .hero-body .no{color:var(--ink-soft); font-family:'Inter',sans-serif; font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;}
  .hero-body h3{
    font-family:'Inter',sans-serif; font-weight:800;
    font-size:clamp(21px,2.6vw,28px); line-height:1.12; margin:8px 0 12px;
  }
  .weekly-summary{
    font-size:16px; line-height:1.65; color:var(--ink);
    padding:20px 2px 26px; border-bottom:1px solid var(--line-strong); margin-bottom:26px;
  }
  .section-title{
    font-family:'Inter',sans-serif; font-weight:900; font-size:24px; text-transform:uppercase; letter-spacing:.02em;
    color:var(--ink); border-top:1px solid var(--line-strong); padding-top:14px; margin:34px 0 18px;
  }
  .mini-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:26px 22px;}
  .mini-card{border-bottom:none; padding:0; cursor:pointer;}
  .mini-card .mc-img{width:100%; aspect-ratio:4/3; margin-bottom:10px;}
  .mini-card .mc-kicker{
    font-family:'Inter',sans-serif; font-weight:800; font-style:italic; font-size:11.5px;
    color:var(--berry); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px;
  }
  .mini-card h4{font-family:'Inter',sans-serif; font-weight:800; font-size:17.5px; margin:0 0 6px; letter-spacing:-.005em; line-height:1.28;}

<script type="module">
/* ============ Firebase ============ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth, connectAuthEmulator, onAuthStateChanged,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously, signOut, deleteUser
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getFirestore, connectFirestoreEmulator, collection, doc, addDoc, updateDoc,

} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  getStorage, connectStorageEmulator, ref as storageRef, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js";
import {
  getFunctions, connectFunctionsEmulator, httpsCallable
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-functions.js";

// Admin accounts are defined by the `adminEmails` array on the settings/app Firestore doc,
// editable from Profile → Admin settings. It's read here at sign-in to auto-grant admin and
// self-heal existing accounts. Enforcement lives in firestore.rules, which reads the same doc.
// (The Firebase web config below is not a secret — web API keys are meant to ship in client
// code; access is enforced by the security rules.)
const firebaseConfig = {
  apiKey: "AIzaSyBf8elXMW9RIiD5iCb17LouhRTxJI6BK08",
  authDomain: "javierweekly-1fc65.firebaseapp.com",
  projectId: "javierweekly-1fc65",
  storageBucket: "javierweekly-1fc65.firebasestorage.app",
  messagingSenderId: "428826814638",
  appId: "1:428826814638:web:7b3463d06030da92d8653f"
};
const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);
const storage = getStorage(firebaseApp);
const functions = getFunctions(firebaseApp);

const runningLocally = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
if(runningLocally){
  connectAuthEmulator(auth, 'http://127.0.0.1:9099', {disableWarnings:true});
  connectFirestoreEmulator(db, '127.0.0.1', 8080);
  connectStorageEmulator(storage, '127.0.0.1', 9199);
  connectFunctionsEmulator(functions, '127.0.0.1', 5001);
}
const runAIEditorFn = httpsCallable(functions, 'runAIEditor');
const verifyGuestPasswordFn = httpsCallable(functions, 'verifyGuestPassword');

let unsubPosts = null, unsubNewsletters = null, unsubSettings = null, unsubUsers = null, unsubInvites = null;
function teardownSubscriptions(){
  if(unsubPosts) unsubPosts(); if(unsubNewsletters) unsubNewsletters(); if(unsubSettings) unsubSettings();
  if(unsubUsers) unsubUsers(); if(unsubInvites) unsubInvites();
  unsubPosts = unsubNewsletters = unsubSettings = unsubUsers = unsubInvites = null;
}
let handledIssueDeepLink = false;
function applyIssueDeepLink(){
  if(handledIssueDeepLink) return;
  handledIssueDeepLink = true;
  const issueId = new URLSearchParams(location.search).get('issue');
  if(!issueId) return;
  if(state.newsletters.some(n=>n.id===issueId)){
    state.activeIssueId = issueId; state.view='issue'; state.issueMode='view'; state.issueFormat='web';
  }
  history.replaceState({}, '', location.pathname);
}

function subscribeToFamilyData(){
  unsubPosts = onSnapshot(collection(db,'posts'), snap=>{
    state.posts = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  });
  unsubNewsletters = onSnapshot(collection(db,'newsletters'), snap=>{
    state.newsletters = snap.docs.map(d=>({id:d.id, ...d.data()}));
    applyIssueDeepLink();
    render();
  });
  unsubSettings = onSnapshot(doc(db,'settings','app'), d=>{
    if(d.exists() && d.data().familyName) state.familyName = d.data().familyName;
    state.adminEmails = (d.exists() && Array.isArray(d.data().adminEmails)) ? d.data().adminEmails : [];
    render();
  });
  if(state.user.isAdmin){
    unsubUsers = onSnapshot(collection(db,'users'), snap=>{
      state.allUsers = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    });
    unsubInvites = onSnapshot(collection(db,'invites'), snap=>{
      state.invites = snap.docs.map(d=>({id:d.id, ...d.data()}));
      render();
    });
  }
}

onAuthStateChanged(auth, async (fbUser)=>{
  state.authChecked = true;
  state.authError = '';
  state.authLoading = false;
  state.guestError = '';
  state.guestLoading = false;
  state.showAuthForm = false;
  state.showGuestForm = false;
  if(!fbUser){
    teardownSubscriptions();
    state.user = null;
    state.posts = []; state.newsletters = []; state.allUsers = []; state.invites = [];
    render();
    return;
  }
  if(fbUser.isAnonymous){
    // Guest via the site password — no Firestore profile, read-only access.
    state.pendingSignupProfile = null;
    state.user = {
      uid: fbUser.uid, firstName:'Guest', lastName:'', email:'', profilePhoto:null,
      isAdmin:false, isAnonymous:true
    };
    subscribeToFamilyData();
    render();
    return;
  }
  let profileSnap = await getDoc(doc(db,'users',fbUser.uid));
  // Admin allowlist lives on settings/app.adminEmails (managed in Profile → Admin settings),
  // read fresh here so promotions/demotions take effect on the next sign-in. firestore.rules
  // enforces the same list server-side.
  const cfgSnap = await getDoc(doc(db,'settings','app'));
  const adminEmails = (cfgSnap.exists() && Array.isArray(cfgSnap.data().adminEmails))
    ? cfgSnap.data().adminEmails.map(e=>String(e).toLowerCase())
    : [];
  const shouldBeAdmin = adminEmails.includes(String(fbUser.email||'').toLowerCase());
  if(!profileSnap.exists()){
    // Invite-only gate: this app doesn't allow open signup. Bootstrap admins are always allowed;
    // anyone else needs a matching invites/{email} doc (added by an admin beforehand). This also
    // covers someone who created the Auth account directly (bypassing our own signup form) — the
    // Firestore rule on `users` create enforces the same check server-side either way.
    let invited = shouldBeAdmin;
    if(!invited){
      const inviteSnap = await getDoc(doc(db,'invites',fbUser.email));
      invited = inviteSnap.exists();
    }
    if(!invited){
      state.pendingSignupProfile = null;
      state.signupBlockedMessage = "This app is invite-only. Ask an admin to add your email, then try again.";
      state.user = null;
      state.authView = 'login';
      render();
      try{ await deleteUser(fbUser); }catch(e){ try{ await signOut(auth); }catch(e2){} }
      return;
    }
    const pending = state.pendingSignupProfile || {firstName:'', lastName:''};
    await setDoc(doc(db,'users',fbUser.uid), {
      firstName: pending.firstName, lastName: pending.lastName,
      email: fbUser.email, isAdmin: shouldBeAdmin
    });
    if(!shouldBeAdmin){
      updateDoc(doc(db,'invites',fbUser.email), {usedAt: todayISO(), usedByUid: fbUser.uid}).catch(()=>{});
    }
    profileSnap = await getDoc(doc(db,'users',fbUser.uid));
  }else if(!!profileSnap.data().isAdmin !== shouldBeAdmin){
    await updateDoc(doc(db,'users',fbUser.uid), {isAdmin: shouldBeAdmin});
    profileSnap = await getDoc(doc(db,'users',fbUser.uid));
  }
  state.pendingSignupProfile = null;
  const profile = profileSnap.data();
  state.user = {
    uid: fbUser.uid, firstName: profile.firstName||'', lastName: profile.lastName||'',
    email: profile.email||fbUser.email, profilePhoto: profile.profilePhoto||null, isAdmin: !!profile.isAdmin,
    isAnonymous:false
  };
  subscribeToFamilyData();
  render();
});

/* ============ helpers ============ */
const uid = () => Math.random().toString(36).slice(2,10);
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};
const dateToISO = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayDate = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const fmtDate = (iso) => { if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); };
const fmtDateFull = (iso) => { if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}); };
const isWithinNextWeek = (iso) => {
  if(!iso) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(iso+'T00:00:00');
  const diffDays = Math.round((target - today) / 86400000);
  return diffDays >= 0 && diffDays <= 7;
}; // retained utility, superseded by calendar-based inPeriod() below

/* ---- calendar period helpers (used by newsletter generation) ---- */
/* both windows are rolling ranges centered on today, not calendar-aligned */
function getWeekRange(d){
  const start = new Date(d); start.setHours(0,0,0,0); start.setDate(start.getDate()-7);
  const end = new Date(d); end.setHours(23,59,59,999); end.setDate(end.getDate()+7);
  return {start, end};
}
function getMonthRange(d){
  const start = new Date(d); start.setHours(0,0,0,0); start.setDate(start.getDate()-31);
  const end = new Date(d); end.setHours(23,59,59,999); end.setDate(end.getDate()+31);
  return {start, end};
}
function inPeriod(post, start, end){
  if(post.postType==='Upcoming Event'){
    if(!post.eventDate) return false;
    const d = new Date(post.eventDate+'T00:00:00');
    const today = new Date(); today.setHours(0,0,0,0);
    return d >= today && d <= end; // upcoming events never look backward, only forward through the window
  }
  const relevant = post.postType==='Event Recap' ? post.eventDate : post.createdAt;
  if(!relevant) return false;
  const d = new Date(relevant+'T00:00:00');
  return d >= start && d <= end;
}
function periodTitle(period, start, end){
  if(period==='monthly'){
    const monthName = new Date().toLocaleDateString('en-US',{month:'long'});
    return `${state.familyName} ${monthName} Newsletter`;
  }
  const monthName = start.toLocaleDateString('en-US',{month:'long'});
  if(start.getMonth()===end.getMonth()) return `${monthName} ${start.getDate()}–${end.getDate()} Newsletter`;
  const endMonth = end.toLocaleDateString('en-US',{month:'long'});
  return `${monthName} ${start.getDate()} – ${endMonth} ${end.getDate()} Newsletter`;
}

const RECURRENCE_FREQUENCIES = ['monthly','yearly'];
const RECURRENCE_LABELS = {monthly:'Monthly', yearly:'Yearly'};

/* Recurring only applies to Upcoming Event posts: post.eventDate anchors the series, and every
   later monthly/yearly date that matches it counts as an occurrence for the feed & calendar. */
function isRecurringPost(p){
  return p.postType==='Upcoming Event' && !!(p.recurring && p.recurring.enabled) && RECURRENCE_FREQUENCIES.includes(p.recurring.frequency);
}
// True if `p` has an occurrence (original or recurring) landing exactly on `dateKey` (YYYY-MM-DD).
function eventOccursOnDate(p, dateKey){
  if(!p.eventDate || dateKey < p.eventDate) return false;
  if(dateKey === p.eventDate) return true;
  if(!isRecurringPost(p)) return false;
  const anchor = new Date(p.eventDate+'T00:00:00');
  const target = new Date(dateKey+'T00:00:00');
  return p.recurring.frequency === 'yearly'
    ? anchor.getDate()===target.getDate() && anchor.getMonth()===target.getMonth()
    : anchor.getDate()===target.getDate();
}
// ISO date of the next occurrence of `p` on/after `fromDate` (a Date at local midnight), or null if
// it has none (already past and not recurring). Both branches skip a candidate date that doesn't
// really exist (e.g. a 31st in a 30-day month, or Feb 29 in a non-leap year) rather than letting
// JS's Date silently normalize it to a nearby date — consistent with eventOccursOnDate's matching.
function nextOccurrenceISO(p, fromDate){
  if(!p.eventDate) return null;
  const fromKey = dateToISO(fromDate);
  if(p.eventDate >= fromKey) return p.eventDate;
  if(!isRecurringPost(p)) return null;
  const anchor = new Date(p.eventDate+'T00:00:00');
  const day = anchor.getDate();
  if(p.recurring.frequency === 'yearly'){
    const month = anchor.getMonth();
    let year = fromDate.getFullYear();
    for(let i=0;i<8;i++){ // a Feb 29 anchor only recurs every leap year (~every 4 years)
      const candidate = new Date(year, month, day);
      if(candidate.getDate()===day && candidate.getMonth()===month && candidate >= fromDate) return dateToISO(candidate);
      year++;
    }
    return null;
  }
  let year = fromDate.getFullYear(), month = fromDate.getMonth();
  for(let i=0;i<24;i++){
    const candidate = new Date(year, month, day);
    if(candidate.getDate()===day && candidate >= fromDate) return dateToISO(candidate);
    month++; if(month>11){month=0; year++;}
  }
  return null;
}

function openLightbox(media, index, alt){
  if(!media || !media.length) return;
  lightbox = {media, index: Math.max(0, Math.min(index, media.length-1)), alt: alt||''};
  renderLightbox();
}
function closeLightbox(){ lightbox = null; renderLightbox(); restoreModalFocus(); }
function lightboxStep(delta){
  if(!lightbox) return;
  const n = lightbox.media.length;
  lightbox.index = (lightbox.index + delta + n) % n;
  renderLightbox();
}
function openPostDetail(postId){
  const post = state.posts.find(p=>p.id===postId);
  const featured = post ? featuredMediaItem(post) : null;
  const index = (post && featured) ? Math.max(0, post.media.indexOf(featured)) : 0;
  postDetail = {postId, index};
  renderPostDetail();
}
function closePostDetail(){ postDetail = null; renderPostDetail(); restoreModalFocus(); }
function postDetailStep(delta){
  if(!postDetail) return;
  const post = state.posts.find(p=>p.id===postDetail.postId);
  const n = (post && post.media && post.media.length) || 0;
  if(!n) return;
  postDetail.index = (postDetail.index + delta + n) % n;
  renderPostDetail();
}
document.addEventListener('keydown', (e)=>{
  if(lightbox){
    if(e.key==='Escape') closeLightbox();
    if(e.key==='ArrowRight') lightboxStep(1);
    if(e.key==='ArrowLeft') lightboxStep(-1);
    return;
  }
  if(postDetail){
    if(e.key==='Escape') closePostDetail();
    if(e.key==='ArrowRight') postDetailStep(1);
    if(e.key==='ArrowLeft') postDetailStep(-1);
    return;
  }
  if(e.key==='Escape' && state.showGenModal){ closeGenerateModal(); return; }
  if(e.key==='Escape' && addPhotosPostId){ closeAddPhotos(); return; }
});

/* ---- "Add more photos" modal — lets any real user contribute media to an Event Recap
   post they didn't write, without touching the rest of the post ---- */
function openAddPhotos(postId){ addPhotosPostId = postId; addPhotosUploading = 0; renderAddPhotosModal(); }
function closeAddPhotos(){ addPhotosPostId = null; renderAddPhotosModal(); restoreModalFocus(); }
async function uploadToExistingPost(postId, file){
  const type = file.type.startsWith('video/') ? 'video' : 'image';
  addPhotosUploading++;
  renderAddPhotosModal();
  try{
    const path = `uploads/${state.user.uid}/${uid()}-${file.name}`;
    const ref = storageRef(storage, path);
    await uploadBytes(ref, file, {contentType:file.type});
    const url = await getDownloadURL(ref);
    await updateDoc(doc(db,'posts',postId), {media: arrayUnion({id:uid(), type, url})});
    showToast('Photo added — thanks for contributing!');
  }catch(err){
    console.error('uploadToExistingPost failed:', err);
    showToast('Upload failed — try that file again');
  }
  addPhotosUploading--;
  renderAddPhotosModal();
}
function renderAddPhotosModal(){
  let host = document.getElementById('addphotos-host');
  if(!host){ host = document.createElement('div'); host.id = 'addphotos-host'; document.body.appendChild(host); }
  const wasOpen = !!document.getElementById('addphotos-overlay');
  if(!addPhotosPostId){ host.innerHTML = ''; return; }
  const post = state.posts.find(p=>p.id===addPhotosPostId);
  if(!post){ addPhotosPostId = null; host.innerHTML = ''; return; }
  const media = post.media || [];
  host.innerHTML = `
    <div class="modal-overlay" id="addphotos-overlay">
      <div class="modal-card" aria-labelledby="addphotos-title">
        <h2 id="addphotos-title" class="display" style="font-size:20px;margin-bottom:4px;">Add photos to "${escapeHtml(post.title)}"</h2>
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:16px;">Anyone can contribute their own photos or videos to an event recap — this only adds to the gallery, it won't change anything else about the post.</div>
        <div class="upload-zone" id="addphotos-zone">Click to add photos or videos</div>
        <input type="file" id="addphotos-file" accept="image/*,video/*" multiple style="display:none;">
        ${media.length || addPhotosUploading ? `
        <div class="thumbs-row" style="margin-top:10px;">
          ${media.map(m=> m.type==='video'
            ? `<div class="t"><video src="${m.url}" muted preload="metadata"></video><span class="vbadge">VIDEO</span></div>`
            : `<div class="t"><img src="${m.url}" alt="Photo from: ${escapeHtml(post.title)}"></div>`
          ).join('')}
          ${Array.from({length:addPhotosUploading}).map(()=>`
            <div class="t" style="display:flex;align-items:center;justify-content:center;background:#F1EFE8;"><span class="spinner" style="border-color:rgba(20,20,18,.25);border-top-color:var(--ink);"></span></div>
          `).join('')}
        </div>` : ''}
        <button class="btn small" id="addphotos-done" style="margin-top:18px;width:100%;">Done</button>
      </div>
    </div>`;
  document.getElementById('addphotos-overlay').addEventListener('click', (e)=>{ if(e.target.id==='addphotos-overlay') closeAddPhotos(); });
  document.getElementById('addphotos-done').addEventListener('click', closeAddPhotos);
  const zone = document.getElementById('addphotos-zone');
  const fileInput = document.getElementById('addphotos-file');
  zone.addEventListener('click', ()=>fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    const postId = addPhotosPostId;
    [...e.target.files].forEach(file=>uploadToExistingPost(postId, file));
    fileInput.value = '';
  });
  setupModalA11y(document.querySelector('#addphotos-overlay .modal-card'), wasOpen);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2600);
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
  }catch(err){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

/* Accessibility: the masthead is position:sticky, so a keyboard user tabbing to content near the
   top of a scrolled view can otherwise land fully behind it (confirmed live: a focused post row
   was completely hidden under the 131px header with no scroll-padding set) — WCAG 2.4.11 Focus
   Not Obscured. Originally re-measured via getBoundingClientRect() on every render(), which forces
   a synchronous layout reflow on every single re-render (this app re-renders on every state change
   and every real-time Firestore update) — a real, measurable performance cost for a value that's
   effectively static between renders. Measures once instead, and only re-measures on an actual
   window resize (the one thing that legitimately changes the header's height, e.g. wrapping to two
   lines under the 560px breakpoint) rather than on every render regardless of whether anything
   about the header could have changed. Doesn't cover the header changing height for some other
   reason mid-session without a resize (e.g. an admin lengthening the family name enough to wrap it)
   — accepted as a rare edge case not worth a per-render reflow to cover. */
let scrollPaddingMeasured = false;
function measureScrollPadding(){
  const header = document.querySelector('.masthead-row');
  document.documentElement.style.scrollPaddingTop = header ? (header.getBoundingClientRect().height + 8) + 'px' : '';
}
function watchScrollPadding(){
  if(scrollPaddingMeasured) return;
  if(!document.querySelector('.masthead-row')) return;
  measureScrollPadding();
  scrollPaddingMeasured = true;
  window.addEventListener('resize', measureScrollPadding);
}

      <div class="form-actions" style="justify-content:stretch;">
        <button class="btn block" id="auth-submit" ${state.authLoading?'disabled':''}>
          ${state.authLoading?'<span class="spinner"></span>Please wait…':(isSignup?'Create account':'Sign in')}
        </button>
      </div>
      <div style="text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:14px;">
        ${isSignup ? 'Already have an account?' : 'New here?'}
        <a href="#" id="auth-toggle" style="color:var(--ink);font-weight:600;">${isSignup?'Sign in':'Create one'}</a>
      </div>
    </div>

    <div style="text-align:center;margin-top:16px;font-size:12.5px;">
      ${isGuestBrowsing
        ? `<a href="#" id="guest-back" style="color:var(--ink-soft);">‹ Back to browsing</a>`
        : `<a href="#" id="guest-toggle" style="color:var(--ink-soft);">Just want to look around?</a>`}
    </div>
    ${(state.showGuestForm && !isGuestBrowsing) ? `
    <div class="form-card" style="margin-top:12px;">
      <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">Browse the newsletter and posts without an account. You won't be able to post or edit anything.</div>
      <label for="guest-password">Site password</label>
      <input type="password" id="guest-password" autocomplete="off">
      ${state.guestError ? `<div role="alert" style="color:var(--berry);font-size:12.5px;margin-top:10px;">${escapeHtml(state.guestError)}</div>` : ''}
      <div class="form-actions" style="justify-content:stretch;">
        <button class="btn secondary block" id="guest-submit" ${state.guestLoading?'disabled':''}>

        </button>
      </div>
    </div>
    ` : ''}

function attachAuthHandlers(){
  const toggle = document.getElementById('auth-toggle');
  if(toggle) toggle.addEventListener('click', (e)=>{
    e.preventDefault();
    state.authView = state.authView==='signup' ? 'login' : 'signup';
    state.authError = '';
    state.signupBlockedMessage = '';
    render();
  });
  const submit = document.getElementById('auth-submit');
  if(submit) submit.addEventListener('click', async ()=>{
    const email = (document.getElementById('auth-email').value||'').trim().toLowerCase();
    const password = document.getElementById('auth-password').value||'';
    const isSignup = state.authView==='signup';
    const firstEl = document.getElementById('auth-first');
    const lastEl = document.getElementById('auth-last');
    const first = firstEl ? firstEl.value||'' : '';
    const last = lastEl ? lastEl.value||'' : '';
    if(!email || !password){ state.authError = 'Email and password are required.'; render(); return; }
    state.authLoading = true; state.authError = ''; state.signupBlockedMessage = ''; render();
    try{
      if(isSignup){
        state.pendingSignupProfile = {firstName:first, lastName:last};
        await createUserWithEmailAndPassword(auth, email, password);
      }else{
        await signInWithEmailAndPassword(auth, email, password);
      }
      // onAuthStateChanged picks up from here (and resets showAuthForm)
    }catch(err){
      state.authError = authErrorMessage(err);
      state.authLoading = false;
      render();
    }
  });
  const guestBack = document.getElementById('guest-back');
  if(guestBack) guestBack.addEventListener('click', (e)=>{
    e.preventDefault();
    state.showAuthForm = false; state.showGuestForm = false;
    render();
  });
  const guestToggle = document.getElementById('guest-toggle');
  if(guestToggle) guestToggle.addEventListener('click', (e)=>{
    e.preventDefault();
    state.showGuestForm = true;
    render();
  });
  const guestSubmit = document.getElementById('guest-submit');
  const guestInput = document.getElementById('guest-password');
  const tryGuestSubmit = async ()=>{
    const pw = guestInput.value||'';
    if(!pw){
      state.guestError = 'Enter the site password.';
      render();
      return;
    }
    state.guestLoading = true; state.guestError = ''; render();
    try{
      // The password is checked server-side; only on success do we start the anonymous session.
      await verifyGuestPasswordFn({ password: pw });
      await signInAnonymously(auth);
      // onAuthStateChanged picks up from here (and resets showAuthForm/showGuestForm)
    }catch(err){
      const code = (err && err.code) || '';
      state.guestError = (code === 'functions/permission-denied' || code === 'functions/invalid-argument')
        ? 'Incorrect password.'
        : 'Something went wrong — please try again.';
      state.guestLoading = false;
      render();
    }
  };
  if(guestSubmit) guestSubmit.addEventListener('click', tryGuestSubmit);
  if(guestInput) guestInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryGuestSubmit(); });
}
function authErrorMessage(err){
  const code = err && err.code || '';
  if(code==='auth/invalid-credential' || code==='auth/wrong-password' || code==='auth/user-not-found') return 'Incorrect email or password.';
  if(code==='auth/email-already-in-use') return 'An account already exists for that email.';
  if(code==='auth/weak-password') return 'Password should be at least 6 characters.';
  if(code==='auth/invalid-email') return 'That email address looks invalid.';
  return 'Something went wrong — please try again.';
}

  if(!host){
    host = document.createElement('div');

    document.body.appendChild(host);

  const wasOpen = !!document.getElementById('lb-overlay');
  if(!lightbox){ host.innerHTML = ''; return; }

  host.innerHTML = `

      <button class="lightbox-close" id="lb-close" aria-label="Close">×</button>
      <div class="lightbox-stage">
        ${lightbox.media.length>1 ? `<button class="lightbox-nav lightbox-prev" id="lb-prev" aria-label="Previous photo">‹</button>` : ''}
        ${item.type==='video'
          ? `<video src="${item.url}" controls autoplay playsinline></video>`
          : `<img src="${item.url}" alt="${escapeHtml(lightbox.alt ? (lightbox.media.length>1 ? `Photo ${lightbox.index+1} of ${lightbox.media.length} from: ${lightbox.alt}` : `Photo from: ${lightbox.alt}`) : 'Photo')}">`}
        ${lightbox.media.length>1 ? `<button class="lightbox-nav lightbox-next" id="lb-next" aria-label="Next photo">›</button>` : ''}
      </div>
      ${lightbox.media.length>1 ? `<div class="lightbox-counter">${lightbox.index+1} / ${lightbox.media.length}</div>` : ''}
    </div>`;
  const overlay = document.getElementById('lb-overlay');

  overlay.addEventListener('click', (e)=>{ if(e.target.id==='lb-overlay') closeLightbox(); });

}

/* per-render cache so thumbnail click handlers can find the full media array they belong to */
let mediaCache = {};
/* renders a row of media thumbnails, capping visible tiles and showing a +N overlay on the last one */
function renderMediaThumbs(media, maxVisible, title){
  if(!media || !media.length) return '';
  maxVisible = maxVisible || 4;
  const cacheId = uid();
  mediaCache[cacheId] = media;
  const visibleCount = media.length > maxVisible ? maxVisible : media.length;
  const tiles = [];
  for(let i=0;i<visibleCount;i++){
    const m = media[i];
    const isLastVisible = i === maxVisible-1 && media.length > maxVisible;
    const remaining = media.length - (maxVisible-1);
    tiles.push(`
      <div class="mt" data-index="${i}" data-alt="${escapeHtml(title||'')}" tabindex="0" role="button" aria-label="${title ? `View photo from: ${escapeHtml(title)}` : 'View photo'}">
        ${m.type==='video' ? `<video src="${m.url}" muted preload="metadata"></video><div class="play-badge">▶</div>` : `<img src="${m.url}" alt="${escapeHtml(title||'')}">`}
        ${isLastVisible ? `<div class="more-overlay">+${remaining}</div>` : ''}
      </div>`);
  }
  return `<div class="media-thumbs" data-cache-id="${cacheId}">${tiles.join('')}</div>`;
}

function ViewRouter(){

/* ---------- HOME ---------- */
function matchesFilter(p, f){
  if(f==='All') return true;
  return p.postType === f;
}
function isTodayEvent(p){ return p.postType==='Upcoming Event' && eventOccursOnDate(p, todayISO()); }

/* posts created before createdAtMs existed fall back to their date-only createdAt,
   so day-level ordering still works even without millisecond precision */
function postSortMs(p){
  if(p.createdAtMs) return p.createdAtMs;
  if(p.createdAt){ const t = new Date(p.createdAt+'T00:00:00').getTime(); if(!isNaN(t)) return t; }
  return 0;
}

function HomeView(){
  const sorted = [...state.posts].sort((a,b)=> state.sortOrder==='earliest'
    ? postSortMs(a)-postSortMs(b)
    : postSortMs(b)-postSortMs(a));
  const listPosts = sorted.filter(p=>matchesFilter(p,state.filter));
  const todays = listPosts.filter(isTodayEvent);
  const rest = listPosts.filter(p=>!isTodayEvent(p));
  const orderedPosts = [...todays, ...rest];

  return `
    <div class="mobile-upcoming">${SidebarUpcomingEvents()}</div>
    <div class="mobile-latest-issue">${SidebarLatestIssue()}</div>
    <div class="chips-row">
      <div class="chips">

      </div>
      <div class="chips-row-actions">
        <label for="sort-select" class="sr-only">Sort posts</label>
        <select class="sort-select" id="sort-select">
          <option value="recent" ${state.sortOrder==='recent'?'selected':''}>Most recent first</option>
          <option value="earliest" ${state.sortOrder==='earliest'?'selected':''}>Earliest first</option>
        </select>
        ${state.user && state.user.isAnonymous
          ? `<button class="btn small" data-login-cta>Log in to post</button>`
          : `<button class="btn small" data-view="create">+ Share Something</button>`}
      </div>
    </div>
    <div class="home-grid">
      <div class="post-list">
        ${orderedPosts.length ? orderedPosts.map(p=>PostRow(p, isTodayEvent(p))).join('') :
          `<div class="empty"><div class="display" style="font-size:20px;">No posts here yet</div>Try a different filter, or be the first to share something.</div>`}
      </div>

function postMetaFields(p){
  // A recurring event's own eventDate is just the series' anchor — once that date has passed,
  // show the next occurrence instead so this doesn't read as a stale date next to a live post.
  const eventDateForDisplay = isRecurringPost(p) ? (nextOccurrenceISO(p, todayDate()) || p.eventDate) : p.eventDate;
  const dateLabel = EVENT_DATED_TYPES.includes(p.postType) ? fmtDateFull(eventDateForDisplay) : fmtDateFull(p.createdAt);
  const words = (p.description||'').trim().split(/\s+/).filter(Boolean).length;
  const readMin = Math.max(1, Math.round(words/130));
  return {dateLabel, readMin};
}

function mediaThumbInner(m, small, alt){

/* ---- Sidebar: upcoming events grouped by week/month ---- */
function SidebarUpcomingEvents(){
  const collapsed = state.upcomingCollapsed;
  const heading = `<div class="side-heading upcoming-events-heading">
    <span>Upcoming Events</span>
    <button class="side-toggle" data-toggle-upcoming title="${collapsed?'Expand':'Collapse'}" aria-label="${collapsed?'Expand':'Collapse'} upcoming events">${collapsed?'▾':'▴'}</button>
  </div>`;
  const now = new Date(); now.setHours(0,0,0,0);
  // Each entry pairs a post with the ISO date of its next occurrence (its own eventDate for a
  // one-off event, or the next matching monthly/yearly date for a recurring one) so a recurring
  // event whose original eventDate has already passed still surfaces here.
  const events = state.posts
    .filter(p=>p.postType==='Upcoming Event' && p.eventDate)
    .map(p=>({post:p, occursOn: nextOccurrenceISO(p, now)}))
    .filter(e=>e.occursOn)
    .sort((a,b)=> a.occursOn.localeCompare(b.occursOn));
  if(!events.length){
    return `<div class="side-card upcoming-events-card">${heading}${collapsed ? '' : `<div class="side-empty">Nothing on the calendar yet.</div><button class="btn secondary small" data-view="calendar" style="margin:0 16px 14px;width:calc(100% - 32px);">View full calendar</button>`}</div>`;
  }
  if(collapsed){
    return `<div class="side-card upcoming-events-card">${heading}</div>`;
  }
  const wk = getWeekRange(now);
  const groups = {};
  events.forEach(e=>{
    const d = new Date(e.occursOn+'T00:00:00');
    const key = (d>=wk.start && d<=wk.end) ? 'This Week' : d.toLocaleDateString('en-US',{month:'long', year:'numeric'});
    if(!groups[key]) groups[key] = [];
    groups[key].push(e);
  });
  const order = Object.keys(groups).sort((a,b)=>{
    if(a==='This Week') return -1;
    if(b==='This Week') return 1;
    return groups[a][0].occursOn.localeCompare(groups[b][0].occursOn);
  });
  return `
  <div class="side-card upcoming-events-card">
    ${heading}
    ${order.map(g=>`
      <div class="side-group-label">${escapeHtml(g)}</div>
      ${groups[g].map(e=>`
        <div class="side-event ${isTodayEvent(e.post) ? 'today-highlight' : ''}" data-jump-post="${e.post.id}" aria-label="Jump to: ${escapeHtml(e.post.title)}">
          <div class="se-date">${new Date(e.occursOn+'T00:00:00').toLocaleDateString('en-US',{weekday:'short'})}<br>${new Date(e.occursOn+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>
          <div class="se-title">${escapeHtml(e.post.title)}${isTodayEvent(e.post) ? ' <span class="today-badge inline">Today</span>' : ''}</div>
        </div>`).join('')}
    `).join('')}
    <button class="btn secondary small" data-view="calendar" style="margin:14px 16px 16px;width:calc(100% - 32px);">View full calendar</button>
  </div>`;
}

/* ---------- CALENDAR ---------- */
function postCalendarDate(p){
  return EVENT_DATED_TYPES.includes(p.postType) ? p.eventDate : p.createdAt;
}
function CalendarView(){
  const {year, month} = state.calendarDate;
  const monthName = new Date(year, month, 1).toLocaleDateString('en-US',{month:'long'});
  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();

  const postsByDate = {};
  const addOnDate = (dateKey, p) => { if(!postsByDate[dateKey]) postsByDate[dateKey] = []; postsByDate[dateKey].push(p); };
  state.posts.forEach(p=>{
    if(isRecurringPost(p)){
      // Expand a recurring event into every occurrence that lands within the currently viewed
      // month, rather than only its original anchor date.
      for(let day=1; day<=daysInMonth; day++){
        const dateKey = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        if(eventOccursOnDate(p, dateKey)) addOnDate(dateKey, p);
      }
      return;
    }
    const dateKey = postCalendarDate(p);
    if(dateKey) addOnDate(dateKey, p);
  });

  const cells = [];
  for(let i=0;i<firstWeekday;i++) cells.push(null);
  for(let day=1; day<=daysInMonth; day++) cells.push(day);
  while(cells.length % 7 !== 0) cells.push(null);

  const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  return `
  <div class="calendar-toolbar">
    <button class="btn secondary small" id="cal-prev">‹ Prev</button>
    <div class="calendar-title">${monthName} ${year}</div>
    <button class="btn secondary small" id="cal-next">Next ›</button>
  </div>
  <div class="calendar-grid">
    ${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
    ${cells.map(day=>{
      if(day===null) return `<div class="cal-cell empty"></div>`;
      const dateKey = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const dayPosts = postsByDate[dateKey] || [];
      const isToday = dateKey === todayISO();
      const cellDateLabel = fmtDateFull(dateKey) + (isToday ? ' (today)' : '');
      return `
      <div class="cal-cell ${isToday?'today':''}" aria-label="${escapeHtml(cellDateLabel)}">
        <div class="cal-daynum" aria-hidden="true">${day}</div>
        ${dayPosts.map(p=>`<div class="cal-post" data-open-post="${p.id}" title="${escapeHtml(p.title)}" aria-label="${escapeHtml(fmtDateFull(dateKey) + ' — ' + p.title)}">${escapeHtml(p.title)}</div>`).join('')}
      </div>`;
    }).join('')}
  </div>
  `;
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

/* Accessibility: a handful of clickable <div>s stand in for buttons/links (cards, thumbnails,
   upload zones) — this makes them keyboard-operable (Tab to focus, Enter/Space to activate)
   without changing how they look. Native interactive elements are left alone. */
function makeKeyboardActivatable(el){
  if(!el || ['BUTTON','A','INPUT','SELECT','TEXTAREA'].includes(el.tagName)) return;
  if(!el.hasAttribute('tabindex')) el.tabIndex = 0;
  if(!el.hasAttribute('role')) el.setAttribute('role','button');
  el.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===' '){
      e.preventDefault();
      el.click();
    }
  });
}

/* Accessibility: shared dialog semantics + focus management for the app's 4 modals (lightbox,
   post detail, generate-newsletter, add-photos). Gives each a role/aria-modal, moves focus in on
   open (only on the transition from closed->open, not on every re-render while already open),
   traps Tab within it while open, and hands focus back to whatever triggered it on close. */
let modalReturnFocusEl = null;
function getFocusableIn(container){
  return [...container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null);
}
function setupModalA11y(dialogEl, alreadyOpen){
  dialogEl.setAttribute('role','dialog');
  dialogEl.setAttribute('aria-modal','true');
  if(!alreadyOpen){
    modalReturnFocusEl = document.activeElement;
    const items = getFocusableIn(dialogEl);
    if(items[0]) items[0].focus();
  }
  dialogEl.addEventListener('keydown', (e)=>{
    if(e.key !== 'Tab') return;
    const items = getFocusableIn(dialogEl);
    if(!items.length) return;
    const first = items[0], last = items[items.length-1];
    if(e.shiftKey){
      if(document.activeElement === first){ e.preventDefault(); last.focus(); }
    }else{
      if(document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });
}
function restoreModalFocus(){
  if(modalReturnFocusEl && document.body.contains(modalReturnFocusEl)) modalReturnFocusEl.focus();
  modalReturnFocusEl = null;
}

/* Renders an image so the whole photo is always visible (never cropped) — any empty margin
   is filled with a blurred copy of the same image instead of a flat placeholder color.
   `eager` should only be passed for the couple of instances likely to be the page's largest
   above-the-fold image (the issue hero, the sidebar's latest-issue promo) — lazy-loading those
   specifically would hurt LCP; everything else defaults to lazy since most instances (post
   thumbnails, mini-cards, grid images) are usually off-screen at load time. */
function letterboxImg(url, alt, wrapClass, eager){
  if(!url) return '';
  const loading = eager ? 'eager' : 'lazy';
  return `<div class="img-blend ${wrapClass||''}">
    <img class="ib-bg" src="${url}" alt="" aria-hidden="true" loading="${loading}">
    <img class="ib-fg" src="${url}" alt="${escapeHtml(alt||'')}" loading="${loading}">
  </div>`;
}

/* ---------- EMAIL PREVIEW + COPY ---------- */
/* ---------- Email letterbox backgrounds: a gradient sampled from each photo's own colors ----------
   Email clients don't support CSS filters (no blur), so instead of a blurred backdrop we sample
   each image's top/bottom average color on a canvas and build a CSS linear-gradient from them —
   real gradient syntax works broadly across modern email clients (Apple Mail, Gmail, Outlook.com,
   Yahoo). A solid bgcolor attribute is still included as a fallback for the rest. */
const imgGradientCache = new Map(); // url -> {c1,c2} once resolved, or null if sampling failed
function sampleImageGradient(url){
  return new Promise((resolve)=>{
    const image = new Image();
    image.crossOrigin = 'anonymous';
    const timer = setTimeout(()=>resolve(null), 5000);
    image.onload = () => {
      clearTimeout(timer);
      try{
        const w = 24, h = 24;
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(image, 0, 0, w, h);
        const data = ctx.getImageData(0, 0, w, h).data;
        let topR=0,topG=0,topB=0,topN=0, botR=0,botG=0,botB=0,botN=0;
        for(let y=0;y<h;y++){
          for(let x=0;x<w;x++){
            const i = (y*w+x)*4;
            if(y < h/2){ topR+=data[i]; topG+=data[i+1]; topB+=data[i+2]; topN++; }
            else { botR+=data[i]; botG+=data[i+1]; botB+=data[i+2]; botN++; }
          }
        }
        resolve({
          c1: `rgb(${Math.round(topR/topN)},${Math.round(topG/topN)},${Math.round(topB/topN)})`,
          c2: `rgb(${Math.round(botR/botN)},${Math.round(botG/botN)},${Math.round(botB/botN)})`
        });
      }catch(err){
        resolve(null); // canvas tainted (no CORS response from image host) or other failure
      }
    };
    image.onerror = () => { clearTimeout(timer); resolve(null); };
    image.src = url;
  });
}
/* Kicks off (or reuses) sampling for a URL — returns a promise that resolves once the color data
   is ready (or null if sampling failed), and re-renders the email preview so the flat fallback
   upgrades to the real gradient without the user having to do anything. */
function ensureImageGradient(url){
  if(!url) return Promise.resolve(null);
  const cached = imgGradientCache.get(url);
  if(cached !== undefined) return cached instanceof Promise ? cached : Promise.resolve(cached);
  const pending = sampleImageGradient(url).then(result=>{
    imgGradientCache.set(url, result);
    if(state.view==='issue' && state.issueFormat==='email') render();
    return result;
  });
  imgGradientCache.set(url, pending);
  return pending;
}
function issueImageUrls(n){
  return [n.heroImage, ...(n.upcomingEvents||[]).map(e=>postFirstImage(e.postId)),
    ...(n.familyUpdates||[]).map(e=>postFirstImage(e.postId)),
    ...(n.eventRecaps||[]).map(e=>postFirstImage(e.postId)),
    ...(n.classifieds||[]).map(e=>postFirstImage(e.postId))
  ].filter(Boolean);
}
function emailBgStyle(url){
  const cached = imgGradientCache.get(url);
  if(cached && !(cached instanceof Promise)){
    return `background:linear-gradient(165deg, ${cached.c1}, ${cached.c2});`;
  }
  // still sampling, or sampling failed (e.g. the image host doesn't send CORS headers, which
  // blocks reading its pixels) — fall back to a cropped copy of the same photo as the background,
  // so it's never just a flat placeholder color.
  if(!url) return '';
  const escUrl = (s) => (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  return `background-image:url('${escUrl(url)}');background-size:cover;background-position:center;`;
}

function emailPlainText(n){
  let t = `${n.title}\n\n${n.heroHeadline}\n${n.heroSummary}\n\n${n.weeklySummary}\n\n`;
  if(n.upcomingEvents && n.upcomingEvents.length){
    t += 'UPCOMING EVENTS\n';
    n.upcomingEvents.forEach(e=>{ t += `- ${e.title} (${fmtDateFull(e.date)}${e.location?', '+e.location:''}): ${e.summary}\n`; });
    t += '\n';
  }
  if(n.familyUpdates && n.familyUpdates.length){
    t += 'FAMILY UPDATES\n';
    n.familyUpdates.forEach(e=>{ t += `- ${e.headline}: ${e.summary}\n`; });
    t += '\n';
  }
  if(n.eventRecaps && n.eventRecaps.length){
    t += 'RECENT MEMORIES\n';
    n.eventRecaps.forEach(e=>{ t += `- ${e.headline}: ${e.summary}\n`; });
    t += '\n';
  }
  if(n.classifieds && n.classifieds.length){
    t += 'CLASSIFIEDS\n';
    n.classifieds.forEach(e=>{ t += `- ${e.headline}: ${e.summary}\n`; });
    t += '\n';
  }
  t += n.closing;
  return t;
}
async function copyEmailToClipboard(n){
  // make sure every image's gradient has resolved (or given up) before copying, so the pasted
  // email doesn't lock in the flat fallback just because sampling hadn't finished yet
  await Promise.all(issueImageUrls(n).map(ensureImageGradient));
  const html = buildEmailHTML(n);
  const plain = emailPlainText(n);
  try{
    if(navigator.clipboard && window.ClipboardItem){
      const item = new ClipboardItem({
        'text/html': new Blob([html], {type:'text/html'}),
        'text/plain': new Blob([plain], {type:'text/plain'})
      });
      await navigator.clipboard.write([item]);
      showToast('Email copied — paste into your email client');
      return;
    }
    throw new Error('Clipboard API unavailable');
  }catch(err){
    try{
      const div = document.createElement('div');
      div.innerHTML = html;
      div.style.position = 'fixed'; div.style.left = '-9999px';
      div.contentEditable = 'true';
      document.body.appendChild(div);
      const range = document.createRange();
      range.selectNodeContents(div);
      const sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(range);
      document.execCommand('copy');
      sel.removeAllRanges();
      document.body.removeChild(div);
      showToast('Email copied — paste into your email client');
    }catch(err2){
      console.error(err2);
      showToast('Could not copy automatically — try selecting the preview manually');
    }
  }
}

const SECTION_POST_TYPE = {upcomingEvents:'Upcoming Event', familyUpdates:'General Announcement', eventRecaps:'Event Recap', classifieds:'Classifieds'};

function EditSection(label, key, n, fields){
  const items = n[key] || [];
  // a post already sitting in any section of this newsletter is off the table everywhere
  // until it's removed — not just from its own section's dropdown
  const usedIds = new Set([
    ...(n.upcomingEvents||[]).map(i=>i.postId),
    ...(n.familyUpdates||[]).map(i=>i.postId),
    ...(n.eventRecaps||[]).map(i=>i.postId),
    ...(n.classifieds||[]).map(i=>i.postId),
  ]);
  const wantedType = SECTION_POST_TYPE[key];
  const candidates = state.posts.filter(p => p.postType===wantedType && !usedIds.has(p.id));
  const fieldLabels = {title:'Title', date:'Date', location:'Location', headline:'Headline', summary:'Summary'};
  return `
  <div class="edit-block">
    <h3 class="section-title" style="margin-top:0;">${label}</h3>
    ${items.length ? items.map((item,i)=>`
      <div class="edit-item">
        <div class="edit-item-controls">
          <div class="edit-item-order">
            <button class="icon-btn mini" data-move-item data-section="${key}" data-index="${i}" data-direction="up" ${i===0?'disabled':''} title="Move up" aria-label="Move up">▲</button>
            <button class="icon-btn mini" data-move-item data-section="${key}" data-index="${i}" data-direction="down" ${i===items.length-1?'disabled':''} title="Move down" aria-label="Move down">▼</button>
          </div>
          <button class="icon-btn danger" data-remove-item data-section="${key}" data-index="${i}" title="Remove from issue" aria-label="Remove from issue">🗑</button>
        </div>
        <div class="edit-item-fields">
          ${fields.map(f=>{
            const val = item[f] || '';
            const fieldId = `item-${key}-${i}-${f}`;
            if(f==='summary'){
              return `<label for="${fieldId}">${fieldLabels[f]}</label><textarea id="${fieldId}" data-item-field data-section="${key}" data-index="${i}" data-field="summary">${escapeHtml(val)}</textarea>`;
            }
            const type = f==='date' ? 'date' : 'text';
            return `<label for="${fieldId}">${fieldLabels[f]}</label><input type="${type}" id="${fieldId}" data-item-field data-section="${key}" data-index="${i}" data-field="${f}" value="${escapeHtml(val)}">`;
          }).join('')}
        </div>
      </div>
    `).join('') : `<div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;">Nothing in this section.</div>`}

    ${candidates.length ? `
      <div class="add-post-row">
        <select id="add-select-${key}" aria-label="Choose a post to add to ${escapeHtml(label)}">
          ${candidates.map(p=>`<option value="${p.id}">${escapeHtml(p.title)}</option>`).join('')}
        </select>
        <button class="btn secondary small" data-add-post="${key}">+ Add post</button>
      </div>
    ` : `<div style="font-size:12px;color:var(--ink-soft);">No more ${label.toLowerCase()} posts available to add.</div>`}
  </div>`;
}
