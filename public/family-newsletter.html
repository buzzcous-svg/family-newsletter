/* ============ handlers ============ */
function attachHandlers(){
  // Skip link: hash-navigation focuses tabindex="-1" targets natively in Chrome/Firefox, but not
  // in Safari — call .focus() explicitly so keyboard focus reliably lands on <main> in every browser.
  const skipLink = document.querySelector('.skip-link');
  if(skipLink) skipLink.addEventListener('click', (e)=>{
    e.preventDefault();
    document.getElementById('main-content')?.focus();
  });
  document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
    state.view = b.dataset.view; render();
  }));
  document.querySelectorAll('[data-login-cta]').forEach(b=>b.addEventListener('click', ()=>{
    state.showAuthForm = true; state.authView = 'login'; render();
  }));
  document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
    state.filter = b.dataset.filter; render();
  }));
  document.querySelectorAll('[data-toggle-upcoming]').forEach(b=>b.addEventListener('click',(e)=>{
    e.stopPropagation();
    state.upcomingCollapsed = !state.upcomingCollapsed; render();
  }));
  const sortSelect = document.getElementById('sort-select');
  if(sortSelect) sortSelect.addEventListener('change', (e)=>{
    state.sortOrder = e.target.value; render();
  });
  document.querySelectorAll('[data-issue]').forEach(b=>b.addEventListener('click',()=>{
    state.activeIssueId = b.dataset.issue; state.view='issue'; state.issueMode='view'; state.issueFormat='web'; render();
  }));
  document.querySelectorAll('[data-delete-issue]').forEach(b=>b.addEventListener('click', async (e)=>{
    e.stopPropagation();
    if(!confirm('Delete this newsletter issue? This cannot be undone.')) return;
    const issueId = b.dataset.deleteIssue;
    const batch = writeBatch(db);
    batch.delete(doc(db,'newsletters',issueId));
    state.posts.filter(p=>(p.newsletterIds||[]).includes(issueId)).forEach(p=>{
      batch.update(doc(db,'posts',p.id), {newsletterIds: arrayRemove(issueId)});
    });
    await batch.commit();
    showToast('Issue deleted');
  }));
  document.querySelectorAll('[data-open-issue]').forEach(b=>b.addEventListener('click',()=>{
    state.activeIssueId = b.dataset.openIssue; state.view='issue'; state.issueMode='view'; state.issueFormat='web'; render();
  }));
  document.querySelectorAll('[data-jump-post]').forEach(b=>b.addEventListener('click',()=>{
    const id = b.dataset.jumpPost;
    state.filter = 'All'; state.view = 'home'; render();
    requestAnimationFrame(()=>{
      const target = document.querySelector(`[data-post-row-id="${id}"]`);
      if(target){
        target.scrollIntoView({behavior:'smooth', block:'center'});
        target.classList.add('flash');
        setTimeout(()=>target.classList.remove('flash'), 1600);
      }
    });
  }));

  const back = document.getElementById('btn-back-issues');
  if(back) back.addEventListener('click', ()=>{ state.view='newsletters'; render(); });

  const openGen = document.getElementById('btn-open-generate');
  if(openGen) openGen.addEventListener('click', openGenerateModal);

  const calPrev = document.getElementById('cal-prev');
  if(calPrev) calPrev.addEventListener('click', ()=>{
    let {year,month} = state.calendarDate;
    month--; if(month<0){month=11; year--;}
    state.calendarDate = {year,month}; render();
  });
  const calNext = document.getElementById('cal-next');
  if(calNext) calNext.addEventListener('click', ()=>{
    let {year,month} = state.calendarDate;
    month++; if(month>11){month=0; year++;}
    state.calendarDate = {year,month}; render();
  });

  /* post edit / delete */
  document.querySelectorAll('[data-edit-post]').forEach(b=>b.addEventListener('click', ()=>{
    const post = state.posts.find(p=>p.id===b.dataset.editPost);
    if(!post) return;
    editingPostId = post.id;
    draftPost = {
      title:post.title, description:post.description||'', postType:post.postType,
      category:post.category, eventDate:post.eventDate||'', media:[...post.media],
      featuredMediaId: post.featuredMediaId||null, uploadingCount:0,
      recurring: post.recurring ? {...post.recurring} : {enabled:false, frequency:'monthly'}
    };
    state.view='create'; render();
  }));
  document.querySelectorAll('[data-delete-post]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Delete this post? It will be removed from your feed and left out of future newsletters.')) return;
    await deleteDoc(doc(db,'posts',b.dataset.deletePost));
    showToast('Post deleted');
  }));
  document.querySelectorAll('[data-add-photos]').forEach(b=>b.addEventListener('click', ()=>{
    openAddPhotos(b.dataset.addPhotos);
  }));

  /* home feed thumbnail -> lightbox */
  document.querySelectorAll('[data-open-thumb]').forEach(el=>el.addEventListener('click', ()=>{
    const media = mediaCache[el.dataset.openThumb];
    openLightbox(media, parseInt(el.dataset.index||'0'), el.dataset.alt||'');
  }));

  /* post title/description -> full post detail modal */
  document.querySelectorAll('[data-open-post]').forEach(el=>el.addEventListener('click', ()=>{
    openPostDetail(el.dataset.openPost);
  }));

  /* newsletter story media thumbs -> lightbox */
  document.querySelectorAll('.media-thumbs[data-cache-id]').forEach(container=>{
    const media = mediaCache[container.dataset.cacheId];
    container.querySelectorAll('.mt').forEach(tile=>{
      tile.addEventListener('click', ()=> openLightbox(media, parseInt(tile.dataset.index||'0'), tile.dataset.alt||''));
    });
  });

  /* keyboard access: these divs act as buttons/links but aren't native focusable elements */
  document.querySelectorAll(
    '[data-open-post], [data-open-thumb], [data-open-issue], [data-jump-post], [data-issue], .mt, #upload-zone, #addphotos-zone'
  ).forEach(makeKeyboardActivatable);

  /* create post form */
  const tTitle = document.getElementById('f-title');
  const tDesc = document.getElementById('f-desc');
  const tType = document.getElementById('f-type');
  const tCat = document.getElementById('f-category');
  const tDate = document.getElementById('f-date');
  const tRecurring = document.getElementById('f-recurring');
  const tRecurringFreq = document.getElementById('f-recurring-freq');
  if(tTitle) tTitle.addEventListener('input', e=>draftPost.title=e.target.value);
  if(tDesc) tDesc.addEventListener('input', e=>draftPost.description=e.target.value);
  if(tCat) tCat.addEventListener('change', e=>draftPost.category=e.target.value);
  if(tDate) tDate.addEventListener('input', e=>draftPost.eventDate=e.target.value);
  if(tType) tType.addEventListener('change', e=>{ draftPost.postType=e.target.value; render(); });
  if(tRecurring) tRecurring.addEventListener('change', e=>{
    if(!draftPost.recurring) draftPost.recurring = {enabled:false, frequency:'monthly'};
    draftPost.recurring.enabled = e.target.checked;
    render();
  });
  if(tRecurringFreq) tRecurringFreq.addEventListener('change', e=>draftPost.recurring.frequency=e.target.value);

  const zone = document.getElementById('upload-zone');
  const fileInput = document.getElementById('f-file');
  if(zone) zone.addEventListener('click', ()=>fileInput.click());
  if(fileInput) fileInput.addEventListener('change', (e)=>{
    [...e.target.files].forEach(file=>uploadMediaFile(file));
    fileInput.value = '';
  });
  document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click', ()=>{
    const removed = draftPost.media.splice(parseInt(b.dataset.rm),1)[0];
    if(removed && draftPost.featuredMediaId===removed.id) draftPost.featuredMediaId = null;
    render();
  }));
  document.querySelectorAll('[data-feature]').forEach(b=>b.addEventListener('click', ()=>{
    draftPost.featuredMediaId = b.dataset.feature; render();
  }));

  const btnCancel = document.getElementById('btn-cancel');
  if(btnCancel) btnCancel.addEventListener('click', ()=>{ draftPost=null; editingPostId=null; state.view='home'; render(); });

  const btnAiDesc = document.getElementById('btn-ai-description');
  if(btnAiDesc) btnAiDesc.addEventListener('click', generateDescription);

  const btnPublish = document.getElementById('btn-publish');
  if(btnPublish) btnPublish.addEventListener('click', publishPost);

  /* newsletter issue: web/email toggle + edit entry */
  document.querySelectorAll('[data-format]').forEach(b=>b.addEventListener('click', ()=>{
    state.issueFormat = b.dataset.format; render();
  }));
  const btnEditIssue = document.getElementById('btn-edit-issue');
  if(btnEditIssue) btnEditIssue.addEventListener('click', ()=>{ state.issueMode='edit'; render(); });
  const btnDoneEditing = document.getElementById('btn-done-editing');
  if(btnDoneEditing) btnDoneEditing.addEventListener('click', ()=>{ state.issueMode='view'; render(); });
  const btnCopyEmail = document.getElementById('btn-copy-email');
  if(btnCopyEmail) btnCopyEmail.addEventListener('click', ()=>{
    const n = state.newsletters.find(x=>x.id===state.activeIssueId);
    if(n) copyEmailToClipboard(n);
  });

  /* newsletter issue editing (admin) — every mutation here persists to Firestore immediately */
  if(state.view==='issue' && state.issueMode==='edit'){
    const n = state.newsletters.find(x=>x.id===state.activeIssueId);
    if(n){
      document.querySelectorAll('[data-field]:not([data-item-field])').forEach(el=>{
        el.addEventListener('change', async ()=>{
          const field = el.dataset.field;
          n[field] = el.value;
          await updateDoc(doc(db,'newsletters',n.id), {[field]: el.value});
        });
      });
      const heroSelect = document.getElementById('hero-post-select');
      if(heroSelect) heroSelect.addEventListener('change', async ()=>{
        const newHero = state.posts.find(p=>p.id===heroSelect.value);
        if(!newHero) return;
        n.heroPostId = newHero.id;
        n.heroHeadline = newHero.title;
        n.heroSummary = newHero.description || '';
        n.heroImage = featuredImageUrl(newHero) || n.heroImage;
        await updateDoc(doc(db,'newsletters',n.id), {
          heroPostId: n.heroPostId, heroHeadline: n.heroHeadline, heroSummary: n.heroSummary, heroImage: n.heroImage
        });
        render();
      });
      document.querySelectorAll('[data-item-field]').forEach(el=>{
        el.addEventListener('change', async ()=>{
          const section = el.dataset.section, idx = parseInt(el.dataset.index), field = el.dataset.field;
          if(!n[section] || !n[section][idx]) return;
          n[section][idx][field] = el.value;
          await updateDoc(doc(db,'newsletters',n.id), {[section]: n[section]});
        });
      });
      document.querySelectorAll('[data-move-item]').forEach(b=>b.addEventListener('click', async ()=>{
        const section = b.dataset.section, idx = parseInt(b.dataset.index), dir = b.dataset.direction;
        const list = n[section];
        if(!list) return;
        const swapWith = dir==='up' ? idx-1 : idx+1;
        if(swapWith < 0 || swapWith >= list.length) return;
        [list[idx], list[swapWith]] = [list[swapWith], list[idx]];
        await updateDoc(doc(db,'newsletters',n.id), {[section]: list});
        render();
      }));
      document.querySelectorAll('[data-remove-item]').forEach(b=>b.addEventListener('click', async ()=>{
        const section = b.dataset.section, idx = parseInt(b.dataset.index);
        const item = n[section] && n[section][idx];
        if(item){
          const post = state.posts.find(p=>p.id===item.postId);
          n[section].splice(idx,1);
          const writes = [updateDoc(doc(db,'newsletters',n.id), {[section]: n[section]})];
          if(post && (post.newsletterIds||[]).includes(n.id)){
            post.newsletterIds = post.newsletterIds.filter(id=>id!==n.id);
            writes.push(updateDoc(doc(db,'posts',post.id), {newsletterIds: arrayRemove(n.id)}));
          }
          await Promise.all(writes);
        }
        render();
      }));
      document.querySelectorAll('[data-add-post]').forEach(b=>b.addEventListener('click', async ()=>{
        const section = b.dataset.addPost;
        const select = document.getElementById(`add-select-${section}`);
        if(!select || !select.value) return;
        const post = state.posts.find(p=>p.id===select.value);
        if(!post) return;
        let item;
        if(section==='upcomingEvents'){
          item = {postId:post.id, title:post.title, date:post.eventDate||'', location:'', summary:post.description||post.title};
        }else{
          item = {postId:post.id, headline:post.title, summary:post.description||post.title};
        }
        if(!n[section]) n[section] = [];
        n[section].push(item);
        post.newsletterIds = [...new Set([...(post.newsletterIds||[]), n.id])];
        await Promise.all([
          updateDoc(doc(db,'newsletters',n.id), {[section]: n[section]}),
          updateDoc(doc(db,'posts',post.id), {newsletterIds: arrayUnion(n.id)})
        ]);
        render();
      }));
    }
  }

  /* profile */
  const btnSaveProfile = document.getElementById('btn-save-profile');
  if(btnSaveProfile) btnSaveProfile.addEventListener('click', async ()=>{
    const firstName = document.getElementById('p-first').value || state.user.firstName;
    const lastName = document.getElementById('p-last').value || state.user.lastName;
    await updateDoc(doc(db,'users',state.user.uid), {firstName, lastName});
    state.user.firstName = firstName; state.user.lastName = lastName;
    showToast('Profile updated'); render();
  });
  const btnSaveAdmin = document.getElementById('btn-save-admin');
  if(btnSaveAdmin) btnSaveAdmin.addEventListener('click', async ()=>{
    const familyName = document.getElementById('a-family').value || state.familyName;
    const adminEmailsEl = document.getElementById('a-admin-emails');
    const adminEmails = [...new Set(
      (adminEmailsEl ? adminEmailsEl.value : '').split(/[\s,;]+/).map(e=>e.trim().toLowerCase()).filter(Boolean)
    )];
    if(adminEmails.length === 0){
      showToast('At least one admin email is required — this would lock everyone out of admin settings.');
      return;
    }
    await setDoc(doc(db,'settings','app'), {familyName, adminEmails}, {merge:true});
    state.adminEmails = adminEmails;
    showToast('Settings saved'); render();
  });
  const btnAddInvite = document.getElementById('btn-add-invite');
  if(btnAddInvite) btnAddInvite.addEventListener('click', async ()=>{
    const input = document.getElementById('invite-email');
    const email = (input && input.value || '').trim().toLowerCase();
    state.inviteError = '';
    if(!email || !email.includes('@') || !email.includes('.')){
      state.inviteError = 'Enter a valid email address.'; render(); return;
    }
    if(state.invites.some(inv=>inv.id===email)){
      state.inviteError = 'That email is already invited.'; render(); return;
    }
    try{
      await setDoc(doc(db,'invites',email), {
        email, invitedAt: todayISO(), invitedBy: state.user.email,
        usedAt: null, usedByUid: null
      });
      showToast('Invite added');
      render();
    }catch(err){
      console.error('add invite failed:', err);
      state.inviteError = 'Could not add invite — try again.';
      render();
    }
  });
  document.querySelectorAll('[data-remove-invite]').forEach(b=>b.addEventListener('click', async ()=>{
    const email = b.dataset.removeInvite;
    const inv = state.invites.find(i=>i.id===email);
    const msg = inv && inv.usedAt
      ? `${email} already created an account — removing this only clears them from the invite list, it won't delete their account. Continue?`
      : `Remove the invite for ${email}?`;
    if(!confirm(msg)) return;
    await deleteDoc(doc(db,'invites',email));
    showToast('Invite removed');
  }));
  document.querySelectorAll('[data-copy-email]').forEach(b=>b.addEventListener('click', async ()=>{
    await copyText(b.dataset.copyEmail);
    showToast('Email copied');
  }));
  const btnCopyAllEmails = document.getElementById('btn-copy-all-emails');
  if(btnCopyAllEmails) btnCopyAllEmails.addEventListener('click', async ()=>{
    const emails = (btnCopyAllEmails.dataset.allEmails||'').split(',').filter(Boolean).join('\n');
    await copyText(emails);
    showToast('All emails copied');
  });
  const btnSignOut = document.getElementById('btn-sign-out');
  if(btnSignOut) btnSignOut.addEventListener('click', async ()=>{
    await signOut(auth);
    state.view = 'home'; state.filter = 'All';
  });
}

/* ---------- media upload ---------- */
async function uploadMediaFile(file){
  const type = file.type.startsWith('video/') ? 'video' : 'image';
  draftPost.uploadingCount = (draftPost.uploadingCount||0) + 1;
  render();
  try{
    const path = `uploads/${state.user.uid}/${uid()}-${file.name}`;
    const ref = storageRef(storage, path);
    await uploadBytes(ref, file, {contentType:file.type});
    const url = await getDownloadURL(ref);
    draftPost.media.push({id:uid(), type, url});
  }catch(err){
    console.error(err);
    showToast('Upload failed — try that file again');
  }
  draftPost.uploadingCount -= 1;
  render();
}

async function publishPost(){
  const d = draftPost;
  if(!d.title || !d.postType){ showToast('Title and post type are required'); return; }
  if(EVENT_DATED_TYPES.includes(d.postType) && !d.eventDate){ showToast('Add the event date'); return; }

  // Recurring only means anything for Upcoming Event, and only once a frequency is actually set —
  // never persist a stray recurring flag against a post type that can't use it.
  const recurring = d.postType==='Upcoming Event' && d.recurring && d.recurring.enabled
    ? {enabled:true, frequency: RECURRENCE_FREQUENCIES.includes(d.recurring.frequency) ? d.recurring.frequency : 'monthly'}
    : null;

  if(editingPostId){
    await updateDoc(doc(db,'posts',editingPostId), {
      title:d.title, description:d.description, postType:d.postType,
      category:d.category, eventDate:d.eventDate||null, media:d.media,
      featuredMediaId:d.featuredMediaId||null, updatedAt: todayISO(), recurring
    });
    showToast('Post updated');
  }else{
    await addDoc(collection(db,'posts'), {
      authorId: state.user.uid, authorName:`${state.user.firstName} ${state.user.lastName}`,
      title:d.title, description:d.description, postType:d.postType, category:d.category,
      eventDate:d.eventDate||null, featuredMediaId:d.featuredMediaId||null,
      createdAt: todayISO(), createdAtMs: Date.now(), media:d.media, newsletterIds:[], recurring
    });
    showToast('Post published');
  }
  draftPost = null; editingPostId = null;
  state.view = 'home'; state.filter='All';
  render();
}

/* ---------- AI: generate newsletter ---------- */
async function generateDescription(){
  if(!draftPost) return;
  if(!draftPost.title || !draftPost.title.trim()){
    showToast('Add a title first so Javier AI has something to work with.');
    return;
  }
  aiDescLoading = true; render();
  try{
    const res = await runAIEditorFn({type:'draft_description', payload:{
      title: draftPost.title, postType: draftPost.postType, category: draftPost.category,
      eventDate: draftPost.eventDate || '', notes: draftPost.description || ''
    }});
    const text = (res.data && res.data.description) || '';
    if(text) draftPost.description = text;
  }catch(err){
    console.error('generateDescription failed:', err, err && err.code, err && err.message);
    showToast('Javier AI hit a snag — try again.');
  }
  aiDescLoading = false; render();
}

async function generateNewsletter(period){
  const now = new Date();
  const range = period==='monthly' ? getMonthRange(now) : getWeekRange(now);
  // posts aren't exclusive to one issue — the same post can be pulled into multiple newsletters
  const pending = state.posts.filter(p=>inPeriod(p, range.start, range.end));
  const issueNo = state.newsletters.length + 1;
  const periodWord = period==='monthly' ? 'month' : 'week';

  aiLoading = true; render();
  try{
    let newsletter;
    if(!pending.length){
      // Nothing to pull from — publish an empty shell rather than inventing content.
      newsletter = {
        issueNo, date: todayISO(), heroPostId: null,
        period, periodStart: range.start.toISOString().slice(0,10), periodEnd: range.end.toISOString().slice(0,10),
        title: periodTitle(period, range.start, range.end),
        heroImage: img('issue-'+issueNo),
        heroHeadline: 'Nothing to report this ' + periodWord,
        heroSummary: '',
        weeklySummary: `No posts came in during this ${periodWord} — check back next time!`,
        upcomingEvents: [], familyUpdates: [], eventRecaps: [], classifieds: [],
        closing: ''
      };
    }else{
      const compact = pending.map(p=>({
        id:p.id, title:p.title, description:p.description, postType:p.postType,
        category:p.category, eventDate:p.eventDate, author:p.authorName,
        mediaCount: (p.media&&p.media.length) || 0
      }));
      const res = await runAIEditorFn({type:'generate', payload:{
        posts: compact, period, familyName: state.familyName
      }});
      const json = res.data || {};

      // Never let the AI rewrite a post's own caption — always use the original text verbatim.
      const withOriginalCaption = (items, isEvent) => (items||[]).map(item=>{
        const post = pending.find(p=>p.id===item.postId);
        if(!post) return null;
        const base = {postId: post.id, summary: post.description || ''};
        return isEvent
          ? {...base, title: item.title || post.title, date: item.date || post.eventDate || '', location: item.location || ''}
          : {...base, headline: item.headline || post.title};
      }).filter(Boolean);

      // a Classifieds post (an item for sale/giveaway) should never become the hero story,
      // even if the AI picks one despite being told not to — fall back to the first non-classifieds post
      const heroCandidate = pending.find(p=>p.id===json.heroPostId);
      const heroPost = (heroCandidate && heroCandidate.postType!=='Classifieds')
        ? heroCandidate
        : (pending.find(p=>p.postType!=='Classifieds') || pending[0]);
      newsletter = {
        issueNo, date: todayISO(), heroPostId: heroPost.id,
        period, periodStart: range.start.toISOString().slice(0,10), periodEnd: range.end.toISOString().slice(0,10),
        title: periodTitle(period, range.start, range.end),
        heroImage: featuredImageUrl(heroPost) || img('issue-'+issueNo),
        heroHeadline: json.heroHeadline || heroPost.title,
        heroSummary: heroPost.description || '',
        weeklySummary: json.weeklySummary || '',
        upcomingEvents: withOriginalCaption(json.upcomingEvents, true),
        familyUpdates: withOriginalCaption(json.familyUpdates, false),
        eventRecaps: withOriginalCaption(json.eventRecaps, false),
        classifieds: withOriginalCaption(json.classifieds, false),
        closing: json.closing || 'See you all next week!'
      };
    }

    const batch = writeBatch(db);
    const newsletterRef = doc(collection(db,'newsletters'));
    batch.set(newsletterRef, newsletter);
    pending.forEach(p=>{ batch.update(doc(db,'posts',p.id), {newsletterIds: arrayUnion(newsletterRef.id)}); });
    await batch.commit();

    state.activeIssueId = newsletterRef.id;
    state.view = 'issue'; state.issueMode = 'view'; state.issueFormat = 'web';
    showToast('Newsletter published ✨');
  }catch(err){
    console.error('generateNewsletter failed:', err, err && err.code, err && err.message);
    const code = (err && err.code) || '';
    if(code==='functions/permission-denied' || code==='permission-denied'){
      showToast('You need admin access to generate newsletters.');
    }else if(code.startsWith('functions/')){
      showToast('The AI editor hit a snag — try again.');
    }else{
      showToast('Could not save the newsletter — try again.');
    }
  }
  aiLoading = false; render();
}

render();
</script>
